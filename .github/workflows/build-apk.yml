name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          java -version

          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1 || true)"
          if [[ "$JAVA_VER_LINE" =~ \"([0-9]+)(\.([0-9]+))? ]]; then
            FIRST_NUM="${BASH_REMATCH[1]}"
            SECOND_NUM="${BASH_REMATCH[3]:-0}"
            if [ "$FIRST_NUM" -eq 1 ]; then
              JAVA_MAJOR="$SECOND_NUM"
            else
              JAVA_MAJOR="$FIRST_NUM"
            fi
          else
            echo "::error::Unable to detect the active Java major version from: $JAVA_VER_LINE"
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PATH="./debug.keystore"
          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"

          if [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool was not found in the configured Java 17 installation (${KEYTOOL_BIN})."
            exit 1
          fi

          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Temporary debug keystore already exists at ${KEYSTORE_PATH}; skipping generation."
          else
            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1; then
              echo "::error::keytool failed to generate temporary debug keystore at ${KEYSTORE_PATH}."
              exit 1
            fi
          fi

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create temporary debug keystore at ${KEYSTORE_PATH}."
            exit 1
          fi

          echo "Verified temporary debug keystore exists."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$EXPECTED_APK")"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ] || [[ "$SOURCE_APK" != *.apk ]]; then
            echo "::error::Verified debug APK is unavailable for release preparation."
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO_NAME="$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release-XXXXXX")"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to prepare APK release asset at ${ASSET_PATH}."
            exit 1
          fi

          echo "Prepared release asset: ${ASSET_NAME}"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not installed on the runner. Skipping release creation."
            exit 1
          fi

          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release APK asset is missing, empty, or invalid. Skipping release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes-XXXXXX.md")"
          cat <<EOF > "$NOTES_FILE"
          Automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** \`${GITHUB_SHA}\`
          - **APK Asset:** \`${ASSET_NAME}\`

          ### Important Notice
          - This APK is intended strictly for testing.
          - This APK is **not** a Google Play Store production release.
          - This APK is signed only with a temporary debug keystore generated during the workflow run.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

          rm -f "$NOTES_FILE"

      - name: Report APK download result
        if: ${{ always() && steps.publish_release.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            if RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null)" && \
               VERIFIED_TAG="$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName' 2>/dev/null)" && \
               VERIFIED_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name' 2>/dev/null)" && \
               [ -n "$RELEASE_URL" ]; then
              echo "GitHub Release published successfully."
              echo "Release Tag: ${VERIFIED_TAG}"
              echo "Release Title: ${VERIFIED_TITLE}"
              echo "Release URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${ASSET_NAME}"

              {
                echo "## Debug APK Published to GitHub Releases"
                echo ""
                echo "- **Release Title:** ${VERIFIED_TITLE}"
                echo "- **Release Tag:** \`${VERIFIED_TAG}\`"
                echo "- **APK Asset:** \`${ASSET_NAME}\`"
                echo "- **Direct Release Page:** ${RELEASE_URL}"
                echo ""
                echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
                echo ""
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available in this workflow run as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::GitHub Release step succeeded, but release verification via gh release view failed. Check the repository Releases page or download the backup artifact 'app-debug-apk'."

              {
                echo "## Debug APK Build Succeeded (Release Verification Unavailable)"
                echo ""
                echo "> **Warning:** The release was created, but its metadata could not be verified automatically."
                echo ""
                echo "- **Backup Actions Artifact:** \`app-debug-apk\` (available in this workflow run's Artifacts section)"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Publishing the APK to GitHub Releases failed, but the debug APK build and Actions artifact upload succeeded. Download the backup artifact 'app-debug-apk' from this workflow run."

            {
              echo "## Debug APK Build Succeeded (GitHub Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Creating the GitHub Release failed. No release URL was published."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` (available in this workflow run's Artifacts section)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
